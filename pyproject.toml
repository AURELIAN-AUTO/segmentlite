[project]
name = "segmentlite"
version = "1.0.0"
description = "Lightweight, unbundled event routing and webhook fan-out API. The 10x cheaper alternative to Twilio Segment."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
